[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "helpio-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "email-validator>=2.2,<3",
    "google-auth>=2.40,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]
