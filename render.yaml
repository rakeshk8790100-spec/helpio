# Render Blueprint: Dashboard > New > Blueprint > pick this repo. Render creates both services from here.
# Secrets marked `sync: false` are asked for once when the Blueprint is first applied (then edit them under
# each service's Environment tab). The database stays on Supabase; no Render database is used.

services:
  # ---- API (FastAPI) ----
  - type: web
    name: helpio-backend
    runtime: docker
    plan: free               # sleeps after 15 min idle; "starter" is always on (then the web app can use the private network)
    region: singapore        # keep both services (and ideally Supabase) in the same region
    rootDir: helpio-backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: prod
      # Database (Supabase > Connect > Session pooler)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      # Auth
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_OWNER_EMAIL
        sync: false
      # Keep it secret and never change it: saved API keys become unreadable
      - key: SETTINGS_ENCRYPTION_KEY
        sync: false
      # Email (Brevo)
      - key: BREVO_SMTP_LOGIN
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      # Job photos and videos (Cloudinary)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Payments (Razorpay)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # AI job write-ups
      - key: ANTHROPIC_API_KEY
        sync: false
      # The web app's public URL (links in emails, Razorpay's return page), e.g. https://helpio-web.onrender.com
      - key: APP_WEB_URL
        sync: false
      - key: REQUIRE_CUSTOMER_APPROVAL
        value: "false"
      - key: REQUIRE_PROVIDER_APPROVAL
        value: "false"

  # ---- Web app (nginx serving the Vite build; forwards /api to the API) ----
  - type: web
    name: helpio-web
    runtime: docker
    plan: free
    region: singapore
    rootDir: helpio-frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Free plan: reach the API over its public https URL (free services can't take private-network traffic).
      # Set API_HOST to helpio-backend's onrender.com host name, without https://.
      # On a paid plan use API_SCHEME=http and API_HOST fromService helpio-backend `hostport` instead.
      - key: API_SCHEME
        value: https
      - key: API_HOST
        sync: false
      # Build-time (Render passes env vars to `docker build` as build args); public values only
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_API_BASE_URL
        value: /api/v1
